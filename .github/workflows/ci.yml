name: astra-v03-ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[api,dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m astra_poc judge-demo
      - run: python -m astra_poc hero-demo
      - run: python -m astra_poc control-demo
      - run: python -m astra_poc demo-failures
      - run: python -m astra_poc real-demo
      - run: python -m astra_poc schema
      - run: python -m astra_poc preregistration
