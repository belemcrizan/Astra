steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/astra-investigation-service:$COMMIT_SHA', '.']

  # 2. Push image to Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/astra-investigation-service:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'astra-investigation-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/astra-investigation-service:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--set-env-vars'
      - 'ASTRA_OUTPUT_DIR=/tmp/artifacts,ASTRA_USE_LLM=false'

images:
  - 'gcr.io/$PROJECT_ID/astra-investigation-service:$COMMIT_SHA'
